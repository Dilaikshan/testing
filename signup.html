<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup and Payment Details</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- <link rel="stylesheet" href="signup.css"> -->
</head>

<body>

    <div class="container mt-5">
        <div class="row justify-content-md-center">
            <div class="col-1"></div>
            <div class="col-10">
                <div class="card">

                    <div class="card-header">
                        <strong>Sign up</strong>
                    </div>

                    <div class="card-body">
                        <form class="row g-3" action="" method="post" onsubmit="return validation()">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="fname" placeholder="<NAME>" name="fname" >
                                    <label for="floatingInput">First Name</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="lname" placeholder="<NAME>" name="lname">
                                    <label for="floatingInput">Last Name</label>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="uname" placeholder="<NAME>" name="uname">
                                    <label for="floatingInput">Username</label>
                                </div>
                            </div>
                            <div class="col-12">
								<button class="btn btn-danger" type="submit">Sign up</button>
							</div>
            
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-1"></div>
        </div>
    </div>

    

    <!-- Custom JavaScript to show/hide forms without reloading the page -->
    <script>
        function showPaymentDetails() {
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('paymentForm').style.display = 'block';
        }
    </script>
    <script src="signup.js"></script>

</body>

</html>
